<!doctype html>
<html lang="en" class="h-full bg-stone-200">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrossPoint Uploader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#f4f1e8',
            ink: '#1f2937'
          },
          boxShadow: {
            glow: '0 0 0 1px rgba(68,64,60,.18), 0 8px 22px rgba(41,37,36,.12)'
          }
        }
      }
    };
  </script>
</head>
<body class="h-full bg-gradient-to-br from-stone-100 via-stone-200 to-zinc-200 text-ink antialiased">
  <div class="min-h-full">
    <header class="mx-auto max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
      <div class="flex flex-col gap-4 rounded-2xl border border-stone-400 bg-paper/90 p-5 shadow-glow sm:flex-row sm:items-center sm:justify-between">
        <div>
          <p class="text-xs uppercase tracking-[0.2em] text-stone-600" data-i18n="heroKicker">WebSocket binary upload</p>
          <h1 class="mt-1 text-2xl font-bold text-stone-900 sm:text-3xl">CrossPoint Uploader</h1>
          <p class="mt-1 text-sm text-stone-700" data-i18n="heroSubtitle">A swift, elegant way to move large files, one clean chapter at a time.</p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <label for="languageSelect" class="text-sm text-stone-700" data-i18n="languageLabel">Language</label>
          <select id="languageSelect" class="rounded-lg border border-stone-400 bg-stone-100 px-3 py-2 text-sm text-stone-800 focus:border-stone-600 focus:outline-none">
            <option value="en">English</option>
            <option value="es">Espanol</option>
          </select>
        </div>
      </div>
    </header>

    <main class="mx-auto grid max-w-6xl gap-6 px-4 pb-1 sm:px-6 lg:grid-cols-3 lg:px-8">
      <section class="rounded-2xl border border-stone-400 bg-paper/90 p-5 shadow-glow lg:col-span-2">
        <form id="uploadForm" class="space-y-4">
          <div>
            <label for="sourceType" class="mb-1 block text-sm font-medium text-stone-900" data-i18n="sourceLabel">Source</label>
            <select id="sourceType" class="w-full rounded-lg border border-stone-400 bg-stone-100 px-3 py-2 text-stone-900 focus:border-stone-600 focus:outline-none">
              <option value="local" data-i18n-option="localSource">Local file</option>
              <option value="url" data-i18n-option="urlSource">From URL</option>
            </select>
          </div>

          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label for="wsUrl" class="mb-1 block text-sm font-medium text-stone-900" data-i18n="wsUrlLabel">WebSocket URL</label>
              <input id="wsUrl" class="w-full rounded-lg border border-stone-400 bg-stone-100 px-3 py-2 text-stone-900 placeholder-stone-500 focus:border-stone-600 focus:outline-none" value="ws://crosspoint.local:81/" placeholder="ws://crosspoint.local:81/" />
            </div>
            <div>
              <label for="targetPath" class="mb-1 block text-sm font-medium text-stone-900" data-i18n="targetPathLabel">Target path</label>
              <input id="targetPath" class="w-full rounded-lg border border-stone-400 bg-stone-100 px-3 py-2 text-stone-900 placeholder-stone-500 focus:border-stone-600 focus:outline-none" value="/" placeholder="/Books" />
            </div>
          </div>

          <div id="localUploadPanel" class="grid gap-4 sm:grid-cols-1">
            <div>
              <label for="fileInput" class="mb-1 block text-sm font-medium text-stone-900" data-i18n="fileLabel">File</label>
              <input id="fileInput" type="file" class="w-full rounded-lg border border-stone-400 bg-stone-100 px-3 py-2 text-sm text-stone-800 file:mr-4 file:rounded-md file:border file:border-stone-500 file:bg-stone-300 file:px-3 file:py-2 file:text-sm file:font-semibold file:text-stone-900 hover:file:bg-stone-200" />
            </div>
          </div>

          <div id="remoteUploadPanel" class="hidden grid gap-4 sm:grid-cols-2">
            <div>
              <label for="remoteUrl" class="mb-1 block text-sm font-medium text-stone-900" data-i18n="remoteUrlLabel">File URL</label>
              <input id="remoteUrl" type="url" class="w-full rounded-lg border border-stone-400 bg-stone-100 px-3 py-2 text-stone-900 placeholder-stone-500 focus:border-stone-600 focus:outline-none" placeholder="https://example.com/book.epub" />
            </div>
          </div>

          <div class="flex flex-wrap gap-3">
            <button id="connectBtn" type="button" class="rounded-lg bg-stone-800 px-4 py-2 font-semibold text-stone-100 transition hover:bg-stone-700" data-i18n="connectBtn">Connect</button>
            <button id="disconnectBtn" type="button" class="rounded-lg bg-stone-500 px-4 py-2 font-semibold text-stone-100 transition hover:bg-stone-600" data-i18n="disconnectBtn">Disconnect</button>
            <button id="uploadBtn" type="submit" class="rounded-lg bg-zinc-700 px-4 py-2 font-semibold text-stone-100 transition hover:bg-zinc-600" data-i18n="uploadBtn">Upload</button>
            <button id="resetBtn" type="button" class="rounded-lg border border-stone-500 px-4 py-2 font-semibold text-stone-800 transition hover:border-stone-600 hover:bg-stone-300" data-i18n="resetBtn">Reset</button>
          </div>
        </form>

        <div class="mt-5 rounded-xl border border-stone-400 bg-stone-100 p-4">
          <div class="mb-2 flex items-center justify-between">
            <p class="text-sm font-semibold text-stone-900" data-i18n="progressLabel">Progress</p>
            <p id="progressText" class="text-sm text-stone-700">0 / 0 bytes</p>
          </div>
          <div class="h-3 overflow-hidden rounded-full bg-stone-300">
            <div id="progressFill" class="h-full w-0 rounded-full bg-gradient-to-r from-stone-800 to-zinc-600 transition-all duration-150"></div>
          </div>
        </div>
      </section>

      <aside class="rounded-2xl border border-stone-400 bg-paper/90 p-5 shadow-glow">
        <h2 class="text-lg font-semibold text-stone-900" data-i18n="statusTitle">Connection</h2>
        <div class="mt-3 space-y-3 text-sm">
          <div class="rounded-lg border border-stone-400 bg-stone-100 p-3">
            <p class="text-stone-500" data-i18n="stateLabel">State</p>
            <p id="connectionState" class="font-semibold text-stone-900" data-i18n="stateDisconnected">Disconnected</p>
          </div>
        </div>

        <h3 class="mt-5 text-base font-semibold text-stone-900" data-i18n="eventsTitle">Events</h3>
        <div id="log" class="mt-2 h-80 overflow-auto rounded-lg border border-stone-400 bg-stone-100 p-3 text-xs leading-5 text-stone-800"></div>
      </aside>
    </main>

    <footer class="mx-auto max-w-6xl px-4 pb-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-center rounded-2xl border border-stone-400 bg-paper/90 p-5 text-center text-xs text-stone-600 shadow-glow">
        Created with love by SantaCRC</a>
      </div>
    </footer>
  </div>


  <script>
    (() => {
      const i18n = {
        en: {
          heroKicker: 'WebSocket binary upload',
          heroSubtitle: 'Every book you upload is a door you open — and the threshold is always waiting.',
          languageLabel: 'Language',
          sourceLabel: 'Source',
          localSource: 'Local file',
          urlSource: 'From URL',
          wsUrlLabel: 'WebSocket URL',
          targetPathLabel: 'Target path',
          fileLabel: 'File',
          remoteUrlLabel: 'File URL',
          connectBtn: 'Connect',
          disconnectBtn: 'Disconnect',
          uploadBtn: 'Upload',
          resetBtn: 'Reset',
          progressLabel: 'Progress',
          statusTitle: 'Connection',
          stateLabel: 'State',
          stateDisconnected: 'Disconnected',
          stateConnecting: 'Connecting...',
          stateConnected: 'Connected',
          eventsTitle: 'Events',
          appReady: 'App ready. Choose a file and upload when you want.',
          alreadyConnected: 'A connection is already open.',
          openingConnection: 'Opening connection to {url}',
          openOk: 'Connection opened.',
          wsError: 'WebSocket error.',
          closed: 'Connection closed.',
          closedDuringUpload: 'Connection closed during upload. Incomplete file may be removed by device.',
          closedAfterAllSentUnconfirmed: 'All chunks were sent, but server did not confirm DONE/PROGRESS completion. Upload not confirmed.',
          uploadNoFile: 'Select a file before uploading.',
          uploadNoUrl: 'Enter a file URL before uploading.',
          invalidFilename: 'File name cannot contain ":" for this START protocol.',
          mkdirSending: 'Ensuring destination path exists via POST /mkdir: {path}',
          mkdirReady: 'Destination path is ready: {path}',
          mkdirFolderCreated: 'Folder ready: {parent}/{name}',
          mkdirFolderExists: 'Folder already exists: {parent}/{name}',
          mkdirFailed: 'Could not prepare destination path: {message}',
          mkdirBestEffortContinue: 'Could not verify POST /mkdir from browser (CORS/network). Continuing upload in best-effort mode.',
          remoteFetchStart: 'Downloading file from {url}',
          remoteFetchDone: 'Remote file ready: {filename}',
          remoteFetchError: 'Could not load the URL: {message}',
          remoteFetchHtml: 'The URL returned an HTML page, not a downloadable file.',
          startSending: 'Sending {start}',
          readyStart: 'Server ready. Upload started.',
          progressLine: 'Progress {received}/{total}',
          done: 'Upload complete.',
          serverError: 'Server error: {message}',
          nonTextFrame: 'Received non-text frame from server.',
          chunksSent: 'All chunks sent; waiting for final server message.',
          cannotConnect: 'Could not start connection: {message}',
          formReset: 'Form reset.',
          wsClosedAfterAck: 'Socket closed after full server acknowledgement.'
        },
        es: {
          heroKicker: 'Subida binaria por WebSocket',
          heroSubtitle: 'Cada libro que subes es una puerta que abres — y el umbral siempre te espera.',
          languageLabel: 'Idioma',
          sourceLabel: 'Origen',
          localSource: 'Archivo local',
          urlSource: 'Desde URL',
          wsUrlLabel: 'URL WebSocket',
          targetPathLabel: 'Ruta destino',
          fileLabel: 'Archivo',
          remoteUrlLabel: 'URL del archivo',
          connectBtn: 'Conectar',
          disconnectBtn: 'Desconectar',
          uploadBtn: 'Subir',
          resetBtn: 'Limpiar',
          progressLabel: 'Progreso',
          statusTitle: 'Conexion',
          stateLabel: 'Estado',
          stateDisconnected: 'Desconectado',
          stateConnecting: 'Conectando...',
          stateConnected: 'Conectado',
          eventsTitle: 'Eventos',
          appReady: 'App lista. Selecciona archivo y sube cuando quieras.',
          alreadyConnected: 'Ya hay una conexion abierta.',
          openingConnection: 'Abriendo conexion a {url}',
          openOk: 'Conexion abierta.',
          wsError: 'Error de WebSocket.',
          closed: 'Conexion cerrada.',
          closedDuringUpload: 'Conexion cerrada durante una subida. El archivo incompleto puede eliminarse en el dispositivo.',
          closedAfterAllSentUnconfirmed: 'Se enviaron todos los chunks, pero el servidor no confirmo DONE/PROGRESS completo. Subida no confirmada.',
          uploadNoFile: 'Selecciona un archivo antes de subir.',
          uploadNoUrl: 'Ingresa una URL de archivo antes de subir.',
          invalidFilename: 'El nombre del archivo no puede contener ":" para este protocolo START.',
          mkdirSending: 'Asegurando que exista la ruta destino via POST /mkdir: {path}',
          mkdirReady: 'Ruta destino lista: {path}',
          mkdirFolderCreated: 'Carpeta lista: {parent}/{name}',
          mkdirFolderExists: 'La carpeta ya existe: {parent}/{name}',
          mkdirFailed: 'No se pudo preparar la ruta destino: {message}',
          mkdirBestEffortContinue: 'No se pudo verificar POST /mkdir desde el navegador (CORS/red). Se continua la subida en modo best-effort.',
          remoteFetchStart: 'Descargando archivo desde {url}',
          remoteFetchDone: 'Archivo remoto listo: {filename}',
          remoteFetchError: 'No se pudo cargar la URL: {message}',
          remoteFetchHtml: 'La URL devolvio una pagina HTML, no un archivo descargable.',
          startSending: 'Enviando {start}',
          readyStart: 'Servidor listo. Comienza la subida.',
          progressLine: 'Progreso {received}/{total}',
          done: 'Subida completada.',
          serverError: 'Error del servidor: {message}',
          nonTextFrame: 'Se recibio un frame no textual del servidor.',
          chunksSent: 'Todos los chunks fueron enviados; esperando mensaje final del servidor.',
          cannotConnect: 'No se pudo iniciar la conexion: {message}',
          formReset: 'Formulario reiniciado.',
          wsClosedAfterAck: 'Socket cerrado despues de confirmacion completa del servidor.'
        }
      };

      const els = {
        languageSelect: document.getElementById('languageSelect'),
        sourceType: document.getElementById('sourceType'),
        wsUrl: document.getElementById('wsUrl'),
        targetPath: document.getElementById('targetPath'),
        fileInput: document.getElementById('fileInput'),
        remoteUrl: document.getElementById('remoteUrl'),
        localUploadPanel: document.getElementById('localUploadPanel'),
        remoteUploadPanel: document.getElementById('remoteUploadPanel'),
        uploadForm: document.getElementById('uploadForm'),
        connectBtn: document.getElementById('connectBtn'),
        disconnectBtn: document.getElementById('disconnectBtn'),
        uploadBtn: document.getElementById('uploadBtn'),
        resetBtn: document.getElementById('resetBtn'),
        connectionState: document.getElementById('connectionState'),
        progressText: document.getElementById('progressText'),
        progressFill: document.getElementById('progressFill'),
        log: document.getElementById('log')
      };

      let socket = null;
      let upload = null;
      let currentLang = 'en';
      const MAX_BUFFERED_BYTES = 1024 * 1024;

      function detectInitialLanguage() {
        const saved = localStorage.getItem('crosspoint.lang');
        if (saved && i18n[saved]) return saved;
        const nav = (navigator.language || 'en').toLowerCase();
        if (nav.startsWith('es')) return 'es';
        return 'en';
      }

      function t(key, vars = {}) {
        const table = i18n[currentLang] || i18n.en;
        const fallback = i18n.en[key] || key;
        const template = table[key] || fallback;
        return template.replace(/\{(\w+)\}/g, (_, token) => (vars[token] ?? `{${token}}`));
      }

      function applyLanguage(lang) {
        currentLang = i18n[lang] ? lang : 'en';
        localStorage.setItem('crosspoint.lang', currentLang);
        document.documentElement.lang = currentLang;
        els.languageSelect.value = currentLang;

        document.querySelectorAll('[data-i18n]').forEach(node => {
          const key = node.getAttribute('data-i18n');
          node.textContent = t(key);
        });

        document.querySelectorAll('[data-i18n-option]').forEach(node => {
          const key = node.getAttribute('data-i18n-option');
          node.textContent = t(key);
        });
      }

      function updateSourceUI() {
        const isRemote = els.sourceType.value === 'url';
        els.remoteUploadPanel.classList.toggle('hidden', !isRemote);
        els.fileInput.disabled = isRemote;
        els.remoteUrl.disabled = !isRemote;
      }

      function addLog(message, cls = '') {
        const line = document.createElement('div');
        line.className = `mb-1 rounded border border-stone-300 px-2 py-1 ${cls}`;
        line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        els.log.prepend(line);
      }

      function setState(i18nKey) {
        els.connectionState.textContent = t(i18nKey);
      }

      function setProgress(received, total) {
        const safeTotal = Number(total) || 0;
        const safeReceived = Number(received) || 0;
        els.progressText.textContent = `${safeReceived.toLocaleString()} / ${safeTotal.toLocaleString()} bytes`;
        els.progressFill.style.width = safeTotal ? `${Math.min(100, (safeReceived / safeTotal) * 100)}%` : '0%';
      }

      function normalizePath(path) {
        const raw = (path || '/').trim();
        if (!raw || raw === '/') return '/';
        const prefixed = raw.startsWith('/') ? raw : `/${raw}`;
        return prefixed.replace(/\/+$/g, '') || '/';
      }

      function deriveFilenameFromUrl(urlValue) {
        try {
          const parsed = new URL(urlValue);
          const lastPart = parsed.pathname.split('/').filter(Boolean).pop();
          if (!lastPart) return 'download.bin';
          return decodeURIComponent(lastPart);
        } catch {
          return 'download.bin';
        }
      }

      function deriveFilenameFromResponse(response, fallbackUrl) {
        const contentDisposition = response.headers.get('content-disposition') || '';
        const filenameMatch = contentDisposition.match(/filename\*?=(?:UTF-8''|\")?([^\";]+)\"?/i);
        if (filenameMatch?.[1]) {
          try {
            return decodeURIComponent(filenameMatch[1].replace(/^\"|\"$/g, ''));
          } catch {
            return filenameMatch[1].replace(/^\"|\"$/g, '');
          }
        }

        return deriveFilenameFromUrl(response.url || fallbackUrl);
      }

      async function loadRemoteFile(urlValue) {
        addLog(t('remoteFetchStart', { url: urlValue }), 'text-stone-700');
        const response = await fetch(urlValue);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const contentType = (response.headers.get('content-type') || '').toLowerCase();
        if (contentType.includes('text/html')) {
          throw new Error(t('remoteFetchHtml'));
        }

        const blob = await response.blob();
        const filename = deriveFilenameFromResponse(response, urlValue);
        addLog(t('remoteFetchDone', { filename }), 'text-stone-700');
        return new File([blob], filename, { type: blob.type || 'application/octet-stream' });
      }

      function cleanupSocket() {
        if (socket) {
          socket.onopen = null;
          socket.onclose = null;
          socket.onerror = null;
          socket.onmessage = null;
        }
        socket = null;
      }

      function resetUploadState() {
        upload = null;
        els.uploadBtn.disabled = false;
      }

      function sendStart(ws) {
        if (!upload || upload.startSent) return;
        const startMessage = `START:${upload.file.name}:${upload.file.size}:${upload.path}`;
        upload.startSent = true;
        addLog(t('startSending', { start: startMessage }), 'text-stone-700');
        ws.send(startMessage);
      }

      function toMkdirEndpoint(wsUrlValue) {
        const wsUrl = new URL(wsUrlValue);
        const httpProtocol = wsUrl.protocol === 'wss:' ? 'https:' : 'http:';
        return `${httpProtocol}//${wsUrl.hostname}/mkdir`;
      }

      async function createFolderViaHttp(mkdirUrl, parentPath, folderName) {
        const form = new URLSearchParams();
        form.set('name', folderName);
        form.set('path', parentPath || '/');

        const response = await fetch(mkdirUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: form.toString()
        });

        const bodyText = (await response.text()).trim();
        const bodyLower = bodyText.toLowerCase();
        const existsByBody = bodyLower.includes('already exists') || bodyLower.includes('exists');

        if (response.ok) {
          if (existsByBody) {
            addLog(t('mkdirFolderExists', { parent: parentPath || '/', name: folderName }), 'text-stone-700');
          } else {
            addLog(t('mkdirFolderCreated', { parent: parentPath || '/', name: folderName }), 'text-stone-700');
          }
          return;
        }

        if (existsByBody) {
          addLog(t('mkdirFolderExists', { parent: parentPath || '/', name: folderName }), 'text-stone-700');
          return;
        }

        throw new Error(bodyText || `HTTP ${response.status}`);
      }

      async function ensureRemotePath(pathValue) {
        if (pathValue === '/') return;

        const mkdirUrl = toMkdirEndpoint(els.wsUrl.value.trim());
        const segments = pathValue.replace(/^\/+|\/+$/g, '').split('/').filter(Boolean);
        let parent = '/';

        addLog(t('mkdirSending', { path: pathValue }), 'text-stone-700');

        for (const segment of segments) {
          await createFolderViaHttp(mkdirUrl, parent, segment);
          parent = parent === '/' ? `/${segment}` : `${parent}/${segment}`;
        }

        addLog(t('mkdirReady', { path: pathValue }), 'text-stone-900');
      }

      function isBrowserFetchNetworkFailure(err) {
        const message = (err && err.message ? err.message : String(err)).toLowerCase();
        return message.includes('networkerror') || message.includes('failed to fetch') || message.includes('fetch');
      }

      function attachSocketHandlers(ws) {
        ws.onmessage = async event => {
          if (typeof event.data !== 'string') {
            addLog(t('nonTextFrame'), 'text-stone-700');
            return;
          }

          const msg = event.data;
          if (msg === 'READY') {
            addLog(t('readyStart'), 'text-stone-900');
            if (upload && !upload.started) {
              upload.started = true;
              await sendChunks();
            }
            return;
          }

          if (msg.startsWith('PROGRESS:')) {
            const [, received, total] = msg.split(':');
            const receivedN = Number(received);
            const totalN = Number(total);
            if (upload && Number.isFinite(receivedN)) upload.bytesServerAcked = receivedN;
            setProgress(receivedN, totalN);
            addLog(t('progressLine', { received, total }), 'text-stone-700');
            return;
          }

          if (msg === 'DONE') {
            setProgress(upload?.file?.size || 0, upload?.file?.size || 0);
            addLog(t('done'), 'text-stone-900');
            resetUploadState();
            return;
          }

          if (msg.startsWith('ERROR:')) {
            addLog(t('serverError', { message: msg.slice(6) }), 'text-stone-900');
            resetUploadState();
            return;
          }

          addLog(msg, 'text-stone-700');
        };
      }

      function connect() {
        if (socket && socket.readyState === WebSocket.OPEN) {
          addLog(t('alreadyConnected'), 'text-stone-700');
          return Promise.resolve(socket);
        }

        return new Promise((resolve, reject) => {
          try {
            const url = els.wsUrl.value.trim();
            const ws = new WebSocket(url);
            ws.binaryType = 'arraybuffer';
            setState('stateConnecting');
            addLog(t('openingConnection', { url }), 'text-stone-700');

            let settled = false;

            ws.onopen = () => {
              settled = true;
              socket = ws;
              attachSocketHandlers(ws);
              setState('stateConnected');
              addLog(t('openOk'), 'text-stone-900');
              resolve(ws);
            };

            ws.onerror = () => {
              addLog(t('wsError'), 'text-stone-900');
              if (!settled) {
                settled = true;
                reject(new Error(t('wsError')));
              }
            };

            ws.onclose = () => {
              if (!settled) {
                settled = true;
                reject(new Error(t('closed')));
              }

              const wasUpload = Boolean(upload);
              const fullAck = upload?.bytesServerAcked >= upload?.file?.size && upload?.file?.size > 0;
              const allChunksSent = upload?.bytesSent >= upload?.file?.size && upload?.file?.size > 0;
              if (fullAck) {
                addLog(t('wsClosedAfterAck'), 'text-stone-900');
                setProgress(upload.file.size, upload.file.size);
              } else if (allChunksSent) {
                addLog(t('closedAfterAllSentUnconfirmed'), 'text-stone-900');
              } else if (wasUpload) {
                addLog(t('closedDuringUpload'), 'text-stone-700');
              } else {
                addLog(t('closed'), 'text-stone-700');
              }

              setState('stateDisconnected');
              resetUploadState();
              cleanupSocket();
            };
          } catch (err) {
            reject(err);
          }
        });
      }

      async function waitForSocketDrain() {
        while (socket && socket.readyState === WebSocket.OPEN && socket.bufferedAmount > MAX_BUFFERED_BYTES) {
          await new Promise(r => setTimeout(r, 8));
        }
      }

      async function sendChunks() {
        if (!socket || socket.readyState !== WebSocket.OPEN || !upload) return;
        const { file, chunkSize, sendDelay } = upload;
        let offset = 0;

        while (offset < file.size) {
          await waitForSocketDrain();
          if (!socket || socket.readyState !== WebSocket.OPEN || !upload) return;

          const chunk = await file.slice(offset, offset + chunkSize).arrayBuffer();
          socket.send(chunk);
          offset += chunk.byteLength;
          upload.bytesSent = offset;
          setProgress(offset, file.size);

          if (sendDelay > 0) {
            await new Promise(r => setTimeout(r, sendDelay));
          }
        }

        addLog(t('chunksSent'), 'text-stone-700');
      }

      async function startUpload(event) {
        event.preventDefault();

        const isRemote = els.sourceType.value === 'url';
        const path = normalizePath(els.targetPath.value.trim() || '/');
        const chunkSize = 1024;
        const sendDelay = 8;
        let file = null;

        if (isRemote) {
          const remoteUrl = els.remoteUrl.value.trim();
          if (!remoteUrl) {
            addLog(t('uploadNoUrl'), 'text-stone-900');
            return;
          }

          try {
            file = await loadRemoteFile(remoteUrl);
          } catch (err) {
            const message = err && err.message ? err.message : String(err);
            addLog(t('remoteFetchError', { message }), 'text-stone-900');
            return;
          }
        } else {
          file = els.fileInput.files?.[0] || null;
          if (!file) {
            addLog(t('uploadNoFile'), 'text-stone-900');
            return;
          }
        }

        if (file.name.includes(':')) {
          addLog(t('invalidFilename'), 'text-stone-900');
          return;
        }

        try {
          await ensureRemotePath(path);
        } catch (err) {
          const message = err && err.message ? err.message : String(err);
          addLog(t('mkdirFailed', { message }), 'text-stone-900');
          if (isBrowserFetchNetworkFailure(err)) {
            addLog(t('mkdirBestEffortContinue'), 'text-stone-700');
          } else {
            els.uploadBtn.disabled = false;
            return;
          }
        }

        let ws;
        try {
          ws = await connect();
        } catch (err) {
          const message = err && err.message ? err.message : String(err);
          addLog(t('cannotConnect', { message }), 'text-stone-900');
          els.uploadBtn.disabled = false;
          return;
        }

        upload = {
          file,
          path,
          chunkSize,
          sendDelay,
          started: false,
          startSent: false,
          bytesSent: 0,
          bytesServerAcked: 0
        };
        els.uploadBtn.disabled = true;
        setProgress(0, file.size);
        sendStart(ws);
      }

      els.languageSelect.addEventListener('change', event => {
        applyLanguage(event.target.value);
      });

      els.sourceType.addEventListener('change', updateSourceUI);

      els.connectBtn.addEventListener('click', () => {
        connect().catch(err => {
          const message = err && err.message ? err.message : String(err);
          addLog(t('cannotConnect', { message }), 'text-stone-900');
        });
      });

      els.disconnectBtn.addEventListener('click', () => {
        if (socket) socket.close();
        resetUploadState();
      });

      els.uploadForm.addEventListener('submit', startUpload);

      els.resetBtn.addEventListener('click', () => {
        els.fileInput.value = '';
        els.remoteUrl.value = '';
        setProgress(0, 0);
        resetUploadState();
        addLog(t('formReset'), 'text-stone-700');
      });

      applyLanguage(detectInitialLanguage());
      updateSourceUI();
      setState('stateDisconnected');
      addLog(t('appReady'), 'text-stone-700');
    })();
  </script>
</body>
</html>
